openapi: 3.0.3
info:
  title: Mistral-Proxy
  description: OpenAI-compatible surface proxied to the Mistral provider.
  version: v1.0
servers:
  - url: https://localhost:8443/mistral-proxy
paths:
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  example: mistral-small-latest
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                stream:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Completion generated
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Missing or invalid API key
  /v1/embeddings:
    post:
      summary: Create embeddings
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  example: mistral-embed
                input:
                  type: string
      responses:
        "200":
          description: Embeddings generated
          content:
            application/json:
              schema:
                type: object
  /v1/models:
    get:
      summary: List available models
      operationId: listModels
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
